<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1 JavaScript - Salman Maula Ash-Shidqi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #0056b3;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
        }
        .result-box {
            background-color: #e9ecef;
            padding: 15px;
            border-left: 5px solid #28a745;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Hasil Perhitungan Luas Bangun Datar</h2>
        <p><strong>Nama:</strong> Salman Maula Ash-Shidqi | <strong>Tugas:</strong> 1 Javascript ES6</p>
        <div id="output-persegi-panjang" class="result-box"></div>
        <div id="output-bujur-sangkar" class="result-box"></div>
        <div id="output-segitiga" class="result-box"></div>
    </div>

    <script>
        /* 
         * 1. Fungsi untuk menghitung Luas Persegi Panjang
         * Rumus: Panjang x Lebar
         * Menggunakan ES6 Arrow Function
         */
        const hitungLuasPersegiPanjang = (panjang, lebar) => {
            const luas = panjang * lebar;
            return `Luas Persegi Panjang dengan panjang ${panjang} dan lebar ${lebar} adalah <strong>${luas}</strong>.`;
        };

        /* 
         * 2. Fungsi untuk menghitung Luas Bujur Sangkar (Persegi)
         * Rumus: Sisi x Sisi
         * Menggunakan ES6 Arrow Function
         */
        const hitungLuasBujurSangkar = (sisi) => {
            const luas = sisi * sisi;
            return `Luas Bujur Sangkar dengan sisi ${sisi} adalah <strong>${luas}</strong>.`;
        };

        /* 
         * 3. Fungsi untuk menghitung Luas Segitiga
         * Rumus: 1/2 x Alas x Tinggi
         * Menggunakan ES6 Arrow Function
         */
        const hitungLuasSegitiga = (alas, tinggi) => {
            const luas = 0.5 * alas * tinggi;
            return `Luas Segitiga dengan alas ${alas} dan tinggi ${tinggi} adalah <strong>${luas}</strong>.`;
        };

        // Mendeklarasikan variabel argumen dengan nilai bebas
        let nilaiPanjang = 15;
        let nilaiLebar = 8;
        let nilaiSisi = 10;
        let nilaiAlas = 12;
        let nilaiTinggi = 9;

        // Menampilkan hasil perhitungan ke dalam elemen HTML menggunakan DOM Manipulation
        document.getElementById("output-persegi-panjang").innerHTML = hitungLuasPersegiPanjang(nilaiPanjang, nilaiLebar);
        document.getElementById("output-bujur-sangkar").innerHTML = hitungLuasBujurSangkar(nilaiSisi);
        document.getElementById("output-segitiga").innerHTML = hitungLuasSegitiga(nilaiAlas, nilaiTinggi);
        
        // Menampilkan hasil juga di Console
        console.log(hitungLuasPersegiPanjang(nilaiPanjang, nilaiLebar));
        console.log(hitungLuasBujurSangkar(nilaiSisi));
        console.log(hitungLuasSegitiga(nilaiAlas, nilaiTinggi));
    </script>

</body>
</html>
